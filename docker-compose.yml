services:
  console:
    build: .
    image: mammotion-console:local
    restart: unless-stopped
    init: true
    env_file: ${ENV_FILE:-.env}
    environment:
      DATA_DIR: /data
      FRONTEND_DIR: /app/frontend/dist
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5000}:5000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
